name: Framework Architecture Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Public Transduction Layer
      uses: actions/checkout@v4

    - name: Set Up Verification Runtime (Python 3.10)
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'
        cache: 'pip'

    - name: Instantiate Toolchain Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Execute Matrix Processor Grid Validation
      run: |
        python src/logic_core/matrix_processor.py
