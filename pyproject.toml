[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seth_unified_architectonics"
version = "3.19.0"
description = "Universal Quantitative Mathematics and computational simulation scripts via Geometric Transduction."
readme = "README.md"
authors = [
    { name = "Seth Allen Codding" }
]
license = { text = "GPL-3.0-only" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22.0"
]
keywords = [
    "discrete-mathematics",
    "fine-structure-constant",
    "physics-engine",
    "unified-architectonics",
    "yang-mills-mass-gap"
]

[project.urls]
Homepage = "https://github.com"
Documentation = "https://doi.org"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.unified_architectonics]
protocol = "GCX-2026-OMNI-SYNTAX-V3.18.6-ISO"
reference = "GCX-2026-UNIVERSAL-3.19.0-ISO"
